[workspace]
resolver = "3"

[workspace.package]
authors = ["MagicBlock contributors"]
edition = "2024"
homepage = "https://github.com/magicblock-labs/engine"
license = "Apache-2.0"
repository = "https://github.com/magicblock-labs/engine"
rust-version = "1.94.1"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "allow"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
wildcard_dependencies = "deny"
