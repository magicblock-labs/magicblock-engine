[workspace]
members = [
    "solana/account",
    "solana/program-runtime",
    "solana/transaction-context",
    "solana/transaction-view",
]
resolver = "3"

[workspace.package]
authors = ["MagicBlock contributors"]
edition = "2024"
homepage = "https://github.com/magicblock-labs/engine"
license = "Apache-2.0"
repository = "https://github.com/magicblock-labs/engine"
rust-version = "1.94.1"
version = "0.1.0"

[workspace.dependencies]
magic-root-interface = { path = "programs/magic-root-interface" }
magic-root-program = { path = "programs/magic-root-program" }
solana-account = { path = "solana/account" }
solana-program-runtime = { path = "solana/program-runtime" }
solana-transaction-context = { path = "solana/transaction-context" }

ahash = "0.8.12"
arc-swap = "1.9.1"
assert_matches = "1.5.0"
base64 = "0.22.1"
bincode = "1.3.3"
bitflags = "2.11.1"
blake3 = "1.8.5"
cfg-if = "1.0.4"
criterion = "0.8.2"
derive_more = "2.1.1"
itertools = "0.13.0"
qualifier_attr = "0.2.2"
rand = "0.9.2"
rustix = { version = "1.1.4" }
serde = "1.0.228"
serde_bytes = "0.11.19"
serde_with = { version = "3.21.0", default-features = false }
snedfile = "0.1"
tar = "0.4.45"
tempfile = "3"
thiserror = "2.0.17"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wincode = "0.5.1"
zstd = { version = "0.13.3", default-features = false }

agave-feature-set = "4.1.1"
agave-precompiles = "4.1.1"
agave-syscalls = { package = "solana-syscalls", version = "=4.1.1", default-features = false }
agave-transaction-view = "4.1.1"
solana-account-info = "3.1.1"
solana-clock = "3.1.0"
solana-compute-budget-instruction = "=4.1.1"
solana-cpi = "3.1.0"
solana-epoch-rewards = "3.0.1"
solana-epoch-schedule = "3.1.0"
solana-feature-gate-interface = { version = "4.0.0", features = ["bincode"] }
solana-fee-structure = "3.0.0"
solana-hash = "4.3.0"
solana-instruction = "3.4.0"
solana-instruction-error = "2.3.0"
solana-instructions-sysvar = "4.0.0"
solana-keypair = "3.1.2"
solana-last-restart-slot = "3.0.0"
solana-loader-v3-interface = "6.1.0"
solana-program-entrypoint = "3.1.1"
solana-program-error = "3.0.1"
solana-pubkey = "4.2.0"
solana-rent = "4.2.0"
solana-sbpf = "=0.21.0"
solana-sdk-ids = "3.1.0"
solana-short-vec = "=3.2.2"
solana-signature = "=3.4.1"
solana-signer = "3.0.1"
solana-slot-hashes = "3.0.1"
solana-stable-layout = "3.0.0"
solana-sysvar = "3.1.1"
solana-sysvar-id = "3.1.0"
solana-system-interface = ">=3.0.0, <3.2.0"
solana-svm-callback = "4.0.0-rc.1"
solana-svm-feature-set = "4.0.0-rc.1"
solana-svm-log-collector = "4.0.0-rc.1"
solana-svm-measure = "4.0.0-rc.1"
solana-svm-timings = "4.0.0-rc.1"
solana-svm-transaction = "4.0.0-rc.1"
solana-svm-type-overrides = "4.0.0-rc.1"
solana-system-interface = ">=3.0.0, <3.2.0"
solana-system-program = "4.0.0-rc.0"
solana-system-transaction = "3.0.0"
solana-sysvar = "3.1.1"
solana-sysvar-id = "3.1.0"
solana-transaction = "4.1.1"
solana-transaction-error = "3.2.0"

[patch.crates-io]
agave-transaction-view = { path = "solana/transaction-view" }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "allow"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
wildcard_dependencies = "deny"
