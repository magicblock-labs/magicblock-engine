[workspace]
members = ["accountsdb", "ledger", "solana/account"]
resolver = "3"

[workspace.package]
authors = ["MagicBlock contributors"]
edition = "2024"
homepage = "https://github.com/magicblock-labs/engine"
license = "Apache-2.0"
repository = "https://github.com/magicblock-labs/engine"
rust-version = "1.94.1"
version = "0.1.0"

[workspace.dependencies]
accountsdb = { path = "accountsdb" }
ledger = { path = "ledger" }
solana-account = { path = "solana/account" }

ahash = "0.8.12"
bincode = "1.3.3"
bitcode = "0.6.9"
bitflags = "2.11.1"
bytemuck = { version = "1.25", features = ["derive", "extern_crate_std"] }
clonetree = "0.0.2"
heed = { version = "0.22.1", default-features = false }
memmap2 = "0.9.10"
parking_lot = "0.12.5"
prometheus = { version = "0.14.0", default-features = false }
qualifier_attr = "0.2.2"
rand = "0.8.5"
scc = "3.7.0"
serde = "1.0.228"
serde_bytes = "0.11.19"
thiserror = "2.0.18"
tracing = "0.1.44"
twox-hash = { version = "2.1.2", default-features = false }
wincode = "0.5.1"
zstd = { version = "0.13.3", default-features = false }

solana-account-info = "3.1.1"
solana-clock = "3.0.1"
solana-instruction-error = "2.3.0"
solana-pubkey = "4.2.0"
solana-sdk-ids = "3.1.0"
solana-sysvar = "4.0.0"


[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "allow"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
wildcard_dependencies = "deny"
