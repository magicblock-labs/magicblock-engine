[package]
authors = { workspace = true }
description = "Zero-copy parser and sanitizer for serialized Solana transactions"
documentation = "https://docs.rs/agave-transaction-view"
edition = "2024"
homepage = { workspace = true }
license = { workspace = true }
name = "agave-transaction-view"
readme = "README.md"
repository = { workspace = true }
version = "4.1.1"

[features]
agave-unstable-api = []
dev-context-only-utils = []

[dependencies]
solana-hash = { workspace = true }
solana-message = { workspace = true }
solana-packet = { workspace = true }
solana-program-runtime = { workspace = true }
solana-pubkey = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-short-vec = { workspace = true }
solana-signature = { workspace = true }
solana-svm-transaction = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-context = { workspace = true }

[dev-dependencies]
# See order-crates-for-publishing.py for using this unusual `path = "."`
agave-transaction-view = { path = ".", features = ["agave-unstable-api", "dev-context-only-utils"] }
bincode = { workspace = true }
criterion = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true, features = ["serde"] }
solana-signature = { workspace = true, features = ["serde"] }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true, features = ["wincode"] }
solana-transaction = { workspace = true, features = ["serde", "wincode"] }
wincode = { workspace = true }

[[bench]]
harness = false
name = "bytes"

[[bench]]
harness = false
name = "transaction_view"
