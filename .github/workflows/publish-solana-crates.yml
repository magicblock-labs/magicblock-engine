name: Publish renamed Solana crates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package crates without uploading to crates.io
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish solana-account
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Publish magicblock-account
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          trap 'git checkout -- Cargo.toml solana/account/Cargo.toml Cargo.lock' EXIT

          sed -i 's/^name = "solana-account"/name = "magicblock-account"/' solana/account/Cargo.toml
          sed -i 's/solana-account = { path = "\."/solana-account = { package = "magicblock-account", path = "."/' solana/account/Cargo.toml
          sed -i 's|solana-account = { path = "solana/account" }|solana-account = { path = "solana/account", package = "magicblock-account" }|' Cargo.toml

          extra=()
          if [ "${{ github.event_name }}" != "release" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            extra+=(--dry-run)
          fi
          cargo publish --allow-dirty --package magicblock-account "${extra[@]}"
